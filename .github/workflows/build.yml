name: Build Installer

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-runner:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: actions-rust-lang/rustfmt@v1
        with:
          manifest-path: runner/Cargo.toml

      - uses: giraffate/clippy-action@v1
        with:
          reporter: github-pr-review
          filter_mode: nofilter
          fail_on_error: true
          clippy_flags: >-
            -r --all-features
            --all-targets
            --
            -D warnings

      - run: cargo test -r --all-features
      - run: cargo build -r --all-features

      - name: Upload Runner
        uses: actions/upload-artifact@v7
        with:
          name: runner
          path: runner/target/release/runner.exe
          if-no-files-found: error

  build-installer:
    needs: build-runner
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: UCRT64
            arch_name: x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup-msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true

      - name: Download Runner
        uses: actions/download-artifact@v8
        with:
          name: runner
          path: runner/target/release

      - name: Build Installer
        shell: msys2 {0}
        run: |
          bash make-msys2-installer

      - name: Set Release Env
        id: set_env
        shell: msys2 {0}
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]] || [[ "$GITHUB_REF" == 'refs/tags/weekly' ]]; then
            echo 'RELEASE_TAG=weekly' >> "$GITHUB_OUTPUT"
            echo 'FILE_NAME=latest' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
            echo "FILE_NAME=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASE_TAG=" >> "$GITHUB_OUTPUT"
            echo "FILE_NAME=${GITHUB_REF//\//-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename Artifacts and Checksums
        if: steps.set_env.outputs.RELEASE_TAG != ''
        env:
          FILE_NAME: ${{ steps.set_env.outputs.FILE_NAME }}
        run: |
          mv Yunzai-*.sfx.exe "Yunzai-$env:FILE_NAME.sfx.exe"
          mv Yunzai-*.win-appimg.exe "Yunzai-$env:FILE_NAME.win-appimg.exe"
          sha512sum.exe Yunzai-* | tee.exe Yunzai-sha512sum.txt

      - name: Upload Results
        uses: actions/upload-artifact@v7
        with:
          name: Yunzai-${{ steps.set_env.outputs.FILE_NAME }}
          path: Yunzai-*

      - name: Upload to Release
        if: steps.set_env.outputs.RELEASE_TAG != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.set_env.outputs.RELEASE_TAG }}
        run: |
          gh release upload "$env:TAG_NAME" Yunzai-* --clobber || `
          gh release create "$env:TAG_NAME" Yunzai-* --title "$env:TAG_NAME"
