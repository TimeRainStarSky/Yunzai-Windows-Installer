[package]
name = "runner"
version = "0.0.1"
edition = "2024"
build = "build.rs"

[dependencies]
windows-sys = { version = "0", features = [
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0"

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
